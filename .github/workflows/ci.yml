name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Veri hattı + değerlendirme (torch yok)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Statik kontrol
        run: ruff check src tests
      - name: Testler (torch gerektirenler atlanır)
        run: python -m pytest tests -q

  ml-smoke:
    name: Eğitim duman testi (CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"
      - name: Duman testi (rastgele küçük model, kalite iddiası yok)
        run: |
          python -m gokturk.train --smoke --max-steps 2 \
            --output-dir outputs/smoke \
            --train-file data/samples/sample_train.jsonl \
            --eval-file data/samples/sample_train.jsonl
      - name: Gerçek eğitimin engellendiğini doğrula (GPU yok)
        run: |
          python -m gokturk.train --config configs/training.yaml > /dev/null 2>&1 \
            && (echo "HATA: GPU olmadan eğitim başlamamalıydı" && exit 1) || echo "beklendiği gibi engellendi"
