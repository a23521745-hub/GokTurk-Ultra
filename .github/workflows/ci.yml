name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Veri hattı + değerlendirme (torch yok)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Statik kontrol
        run: ruff check src tests
      - name: Testler (torch gerektirenler atlanır)
        run: python -m pytest tests -q

  data-pipeline:
    name: Sentetik veri planı + kalite kapısı (ağ yok)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 10k plan üret (API çağrısı yapmaz)
        run: |
          python -m gokturk.data_generation --mode pro --target 10000 \
            --plan-only --plan-out /tmp/plan.json
          python -c "import json;d=json.load(open('/tmp/plan.json'));assert len(d['slots'])==10000;print('plan ok')"
      - name: Örnek veriyi doğrula ve böl
        run: |
          python -m gokturk.data_quality --data data/samples/sample_train.jsonl --out-dir /tmp/processed
          python -m gokturk.evaluate --mode format --data /tmp/processed/train.jsonl > /dev/null
      - name: Anahtar yokken üretimin durduğunu doğrula
        run: |
          python -m gokturk.data_generation --mode pro --target 5 --out /tmp/x.jsonl \
            && (echo "HATA: anahtarsız üretim başlamamalıydı" && exit 1) || echo "beklendiği gibi durdu"

  ml-smoke:
    name: Eğitim duman testi (CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"
      - name: Duman testi (rastgele küçük model, kalite iddiası yok)
        run: |
          python -m gokturk.train --smoke --max-steps 2 \
            --output-dir outputs/smoke \
            --train-file data/samples/sample_train.jsonl \
            --eval-file data/samples/sample_train.jsonl
      - name: Gerçek eğitimin engellendiğini doğrula (GPU yok)
        run: |
          python -m gokturk.train --config configs/training.yaml > /dev/null 2>&1 \
            && (echo "HATA: GPU olmadan eğitim başlamamalıydı" && exit 1) || echo "beklendiği gibi engellendi"
      - name: Unsloth arka ucu olmadan da dürüstçe engelliyor
        run: |
          python -m gokturk.train --backend unsloth --config configs/training_unsloth_t4.yaml \
            > /dev/null 2>&1 \
            && (echo "HATA: Unsloth yokken eğitim başlamamalıydı" && exit 1) || echo "beklendiği gibi engellendi"
