# GökTürk-Ultra v1 — Qwen3.5-9B tabanı (Kaggle 2×T4, 4-bit QLoRA)
# ---------------------------------------------------------------------------
# NEDEN BU TABAN
#   * gpt-oss-20b Kaggle'da 4-bit QLoRA ile ~14 GB VRAM ister: tek T4'e sığar
#     ama sınırda, ve T4'te bf16 olmadığı için ıraksama riski belgelenmiş.
#   * Qwen3.5-9B 4-bit QLoRA'da (bu repodaki tahmin aracı, T4 15.6 GB):
#       seq_len 1024 -> ≈7.2 GB, seq_len 2048 -> ≈9.1 GB. 16 GB T4'te rahat.
#   * Apache-2.0, gated değil, Unsloth GGUF'ları mevcut (Qwen3.5-9B-GGUF).
#   * Kimlik ve parametre sayısı HF model API'sinden doğrulandı (2026-10-25).
#
# DİKKAT — ÇOK KİPLİ AMA METİN YOLU YETER (2026-10-25'te düzeltildi)
#   Qwen3.5 mimarisi görüntü+metin (Qwen3_5ForConditionalGeneration) olsa da
#   AutoProcessor GEREKMEZ: transformers'ta `Qwen3_5ForCausalLM`
#   `_keys_to_ignore_on_load_unexpected = [r"^mtp.*", r"^model.visual.*"]`
#   tanımlar, görüntü kulesi ağırlıkları yüklenirken yok sayılır. Yani mevcut
#   `AutoModelForCausalLM` + `AutoTokenizer` yolu metin SFT'si için yeterlidir
#   (kaynak: transformers models/qwen3_5/modeling_qwen3_5.py).
#   YENİ KISIT DİSKTİR: 9B bf16 ≈18 GB, Kaggle'da ölçülen boş alan 19,2 GB →
#   `weights-disk-tight` uyarısı çıkar. İlk gerçek koşu bu yüzden
#   configs/training_qwen3_5_4b_t4.yaml (4B, ≈9,3 GB indirme) ile yapılır;
#   gerekçe docs/kaggle-gercek-kosus.md içinde.
#
# Bu dosya bir GARANTİ değildir. Gerçek koşu yapılmadan hiçbir başarı iddiası
# üretilmez; önce `--plan-only` ve duman testi.
# ---------------------------------------------------------------------------

model:
  name_or_path: Qwen/Qwen3.5-9B
  dtype: auto            # T4 bf16 desteklemez -> fp16
  load_in_4bit: true     # NF4 QLoRA; ≈6–7 GB VRAM
  unsloth_4bit: false
  trust_remote_code: false
  attn_implementation: sdpa

quantization:
  method: nf4
  double_quant: true
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Qwen ailesi llama-tipi projeksiyon adlarını kullanır.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: none

data:
  train_file: data/processed/train.jsonl
  eval_file: data/processed/valid.jsonl
  max_seq_len: 2048      # 9B'de 2048 rahat; 1024'ten başlamak da güvenli
  prompt_field: prompt
  response_field: response

optimization:
  method: qlora
  epochs: 1
  max_steps: 60          # önce ölçüm koşusu
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8     # etkin batch = 16
  learning_rate: 0.0001              # 9B için 1e-4 makul; ıraksarsa 5e-5'e inin
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 3407
  logging_steps: 1
  save_steps: 30
  save_total_limit: 2
  eval_steps: 30
  report_to: none

output_dir: outputs/qwen3_5-9b-t4-qlora
require_preflight_ok: true
allow_unverified_hardware: false
gradient_checkpointing_kwargs:
  use_reentrant: false
peft: true
