# GökTürk-Ultra v1 — Qwen3-14B tabanı (metin, Kaggle 2×T4, 4-bit QLoRA)
# ---------------------------------------------------------------------------
# NEDEN BU TABAN
#   * Metin-only (Qwen3ForCausalLM): görüntü kulesi yok, yükleyici basit
#     (AutoModelForCausalLM + AutoTokenizer). Qwen3.5 ailesi çok kipli olduğu
#     için boru hattına ek karmaşıklık getirir.
#   * VRAM (bu repodaki tahmin aracı, T4 15.6 GB, 4-bit QLoRA):
#       seq_len 1024 -> ≈11.8 GB (rahat)
#       seq_len 2048 -> ≈14.9 GB (sınırda; "vram-tight" uyarısı çıkar)
#     Yani 2048 bağlamda pay kalmaz: OOM görürseniz max_seq_len'i 1024'e indirin.
#     gpt-oss-20b'nin (≈21 GB, engelleyici) yanında yine de çok daha güvenli.
#   * Apache-2.0, gated değil, GGUF quant'ları yaygın (Q4_K_M ≈8.4–9 GB).
#   * Eğitim verisi/uzunluk ayarları aynı; yalnızca taban değişiyor.
#
# Karar gerekçesi ve boyut/hız tabloları: docs/taban-model-secimi.md
# ---------------------------------------------------------------------------

model:
  name_or_path: Qwen/Qwen3-14B
  dtype: auto            # T4 -> fp16
  load_in_4bit: true     # ≈9–10 GB VRAM
  unsloth_4bit: false
  trust_remote_code: false
  attn_implementation: sdpa

quantization:
  method: nf4
  double_quant: true
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: none

data:
  train_file: data/processed/train.jsonl
  eval_file: data/processed/valid.jsonl
  max_seq_len: 1024      # 2048'de tahmin ≈14.9 GB: sınırda, OOM riski
  prompt_field: prompt
  response_field: response

optimization:
  method: qlora
  epochs: 1
  max_steps: 60
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16    # etkin batch = 16
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 3407
  logging_steps: 1
  save_steps: 30
  save_total_limit: 2
  eval_steps: 30
  report_to: none

output_dir: outputs/qwen3-14b-t4-qlora
require_preflight_ok: true
allow_unverified_hardware: false
gradient_checkpointing_kwargs:
  use_reentrant: false
peft: true
