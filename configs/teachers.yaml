# Öğretmen model yapılandırması (sentetik veri üretimi)
# ---------------------------------------------------------------------------
# `base_url` ve `model` alanları SAĞLAYICININ KENDİ BELGESİNDEN alınmıştır;
# hiçbir adres veya model kimliği tahmin edilmemiştir. Doğrulama kaydı:
#   * https://evren-llmapi.ssyz.org.tr/v1 — 2026-10-25 tarihli kimliksiz GET,
#     sağlayıcının kendi {"error": {"message": "API anahtarı eksik"}} yanıtını
#     döndürdü (yani uç nokta canlı ve OpenAI uyumlu).
#   * `glm-5.3` ve `mimo-v2.6-pro` — EVREN'in kendi model filosu sayfasında
#     (https://evren.ssyz.org.tr/llm-inference) "Çevrimiçi" olarak listeleniyor
#     ve bağımsız EVREN istemcilerinin model listelerinde aynı kimliklerle
#     geçiyor. Tarih: 2026-10-25.
#   * Kimlikler değişirse tahmin etmeyin: `python -m gokturk.data_generation
#     --list-models` sağlayıcının /models listesini alır ve buradaki
#     kimliklerle karşılaştırır.
#   * Her alan `env:DEGISKEN_ADI` biçiminde de yazılabilir (ör. geçici olarak
#     başka bir modele yönlendirmek için); değişken tanımlı değilse üretim
#     ağa çıkmadan durur.
#   * API anahtarı burada YOKTUR. Yalnızca anahtarın okunacağı ortam
#     değişkeninin adı yazılır (`api_key_env`). Anahtarı asla dosyaya,
#     notebook'a, loga veya commit'e koymayın.
# ---------------------------------------------------------------------------

provider:
  name: ssyz-evren
  # EVREN'in OpenAI uyumlu taban adresi (2026-10-25'te doğrulandı).
  base_url: "https://evren-llmapi.ssyz.org.tr/v1"
  api_style: openai-chat
  api_key_env: EVREN_API_KEY
  # 2026-10-26 Kaggle koşusu: 180 sn'lik okuma zaman aşımları saatler yedi ve
  # tek bir kayıt üretmedi. 120 sn, 4096 token'lık normal bir yanıt için fazlasıyla
  # yeterli; takılan isteği daha erken keser. Meşru yanıtlar 120 sn'yi aşıyorsa
  # burayı yükseltin (ölçerek, tahminle değil).
  timeout_s: 120
  max_retries: 4
  backoff_base_s: 2.0
  backoff_max_s: 60.0
  # Sağlayıcının belgelenmiş oran sınırına göre ayarlayın.
  requests_per_minute: 15
  # 3 yerine 2: aynı isteği 3 kez denemek, hata deterministikse sadece zaman
  # kaybettirir. Boş yanıtta zaten ayrı bir "token bütçesini yükselt" denemesi var.
  max_attempts_per_sample: 2
  abort_after_consecutive_failures: 8
  extra_headers: {}

teachers:
  # Öğretmen 1 — akıl yürütme, mimari ve ileri Türkçe görevleri
  # NOT: `role` yalnızca YÖNLENDİRME ipucudur; model kimliği ve yetenekleri
  # sağlayıcının belgesinden doğrulanmalıdır. Roller: general | reasoning | code
  - name: mimo-v26-pro
    model: "mimo-v2.6-pro"
    role: "reasoning,general"
    weight: 1.0
    temperature: 0.6
    top_p: 0.95
    # Reasoning modelleri bütçeyi düşünme zincirinde harcayabiliyor; 2048 ile
    # 118 kez boş içerik (finish_reason=length) döndü. 4096 + tek kademeli
    # yükseltme (teachers.MAX_ESCALATED_TOKENS) bu sorunu kapatır.
    max_tokens: 4096

  # Öğretmen 2 — kodlama, hata ayıklama ve araç çağırma görevleri
  # NOT: Bu rolde başlangıçta Kimi-K3 planlanmıştı; EVREN'in model listesinde
  # Kimi bulunmadığı için (operatör bilgisi, 2026-10) GLM-5.3 ile
  # değiştirilmiştir. Kodlama/ajan yetenekleri bu rolün gereksinimini karşılar.
  - name: glm-53
    model: "glm-5.3"
    role: "code,general"
    weight: 1.0
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096

generation_prompt_version: v1
